<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Misión Roles ICX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
/* Layout: barra de progreso fija + ruta de misión (7 niveles + certificado) a la izquierda + panel de lectura/reto; en móvil la ruta pasa a fila horizontal */
:root{
  --navy:#000933; --orange:#ec891d; --orange-2:#f6a646; --charcoal:#1d1f20;
  --bg:#f6f6f9; --surface:#ffffff; --fg:#000933; --muted:#5b6078; --line:#e3e4ec; --orange-soft:#fdebd7;
  --ok:#1f8a5b; --ok-soft:#e3f4ec; --bad:#c2402b; --bad-soft:#fbe7e3; --lock:#b8bbc9;
  --font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --script:"Playfair Display",Georgia,"Times New Roman",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070b22; --surface:#10163a; --fg:#eef0f8; --muted:#a3a8c3; --line:#252c55;
  --orange-soft:#3a2610; --ok-soft:#0f2e22; --bad-soft:#3a1712; --lock:#4a5078; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070b22; --surface:#10163a; --fg:#eef0f8; --muted:#a3a8c3; --line:#252c55;
  --orange-soft:#3a2610; --ok-soft:#0f2e22; --bad-soft:#3a1712; --lock:#4a5078; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#000933}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#000933;color:#fff;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.2px}
.brand img{height:34px;width:auto}
.brand small{display:block;font-weight:400;color:#b9bfdc;font-size:12px}
.stats{margin-left:auto;display:flex;gap:18px;align-items:center;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-size:18px;color:var(--orange)}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#b9bfdc}
.bar{flex-basis:100%;height:6px;background:#1c2350;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--orange);transition:width .5s ease}

.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;
  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.route{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:110px}
.route h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 8px}
.stop{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:none;border:0;text-align:left;
  padding:7px 8px;border-radius:var(--r);color:var(--fg);position:relative}
.stop:not(:last-child)::after{content:"";position:absolute;left:27px;top:46px;width:2px;height:14px;background:var(--line)}
.stop.done:not(:last-child)::after{background:var(--orange)}
.stop .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;
  border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.stop .t{font-weight:600;font-size:14px;line-height:1.25}
.stop .s{font-size:12px;color:var(--muted)}
.stop.open .dot{border-color:var(--orange);color:var(--orange)}
.stop.done .dot{background:var(--orange);border-color:var(--orange);color:#fff}
.stop.cur{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.stop.locked{cursor:not-allowed}
.stop.locked .t,.stop.locked .s{color:var(--lock)}
.stop:hover:not(.locked){background:var(--surface)}

.panel{min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--orange);font-weight:700;margin:0 0 6px}
h1{font-size:30px;line-height:1.15;margin:0 0 10px;text-wrap:balance}
.lead{color:var(--muted);max-width:64ch;margin:0 0 22px;font-size:16px}
.mission{background:#000933;color:#fff;border-radius:var(--r);padding:18px 20px;margin:0 0 18px;display:flex;gap:14px;align-items:flex-start}
.mission b{color:var(--orange);display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.mission .ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-weight:700;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:999px;padding:1px 8px;vertical-align:1px}
.tag.e{background:var(--orange);color:#fff}
.tag.o{background:transparent;color:var(--muted);border:1px solid var(--line)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin:0 0 26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15px}
.card .d{margin:0;font-size:13px;color:var(--muted)}
.card ul{margin:0;padding-left:18px;font-size:14px}
.card li{margin:4px 0}
.card li::marker{color:var(--orange)}
.learn{margin-top:auto;align-self:flex-start;border:1px solid var(--orange);color:var(--orange);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.learn[aria-pressed="true"]{background:var(--orange);color:#fff}
.hint{font-size:13px;color:var(--muted);margin:-10px 0 22px}
table.cyc{width:100%;border-collapse:collapse;font-size:13.5px}
table.cyc th{background:var(--orange);color:#fff;text-align:left;padding:7px 9px;font-weight:600}
table.cyc td{border-bottom:1px solid var(--line);padding:7px 9px;vertical-align:top}
.tw{overflow-x:auto}

.challenge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;border-top:4px solid var(--orange)}
.challenge h2{margin:0 0 4px;font-size:20px}
.challenge .sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.qcount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.q{font-size:17px;font-weight:600;margin:0 0 14px;max-width:65ch}
.opts{display:grid;gap:10px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--fg)}
.opt:hover:not(:disabled){border-color:var(--orange)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:14px}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:600;background:var(--orange);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.order{display:grid;gap:8px;margin-bottom:6px}
.slot{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
.slot .n{width:26px;height:26px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.slot.filled{border-style:solid}
.slot.right{background:var(--ok-soft);border-color:var(--ok)}
.slot.wrong{background:var(--bad-soft);border-color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chip{border:1px solid var(--orange);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:14px}
.chip:hover{background:var(--orange-soft)}

.badges{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 22px}
.badge{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;font-weight:600}
.badge i{width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.badge.off{opacity:.4}
.namefield{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.namefield input{flex:1 1 240px;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}

/* ===== Certificado (objeto impreso: colores fijos en ambos temas) ===== */
.cert-wrap{overflow-x:auto;padding-bottom:6px}
.cert{position:relative;width:100%;min-width:640px;aspect-ratio:1.414/1;background:#fffdf9;color:#000933;border-radius:6px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,9,51,.18),0 2px 6px rgba(0,9,51,.08);font-family:var(--font)}
.cert svg.deco{position:absolute;inset:0;width:100%;height:100%}
.cert .frame{position:absolute;inset:3.2%;border:1.5px solid #000933;border-radius:3px}
.cert .frame::after{content:"";position:absolute;inset:6px;border:1px solid rgba(236,137,29,.75);border-radius:2px}
.cert .inner{position:absolute;inset:6% 9% 11.5%;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert .logo{height:15%;width:auto;margin-bottom:2.2%}
.cert .k{font-size:clamp(9px,1.25vw,13px);letter-spacing:.42em;text-transform:uppercase;color:#ec891d;font-weight:700;margin:0}
.cert .title{font-size:clamp(26px,4.6vw,50px);font-weight:800;letter-spacing:.06em;margin:.4% 0 0;line-height:1;color:#000933}
.cert .title span{color:#ec891d}
.cert .give{font-size:clamp(10px,1.3vw,14px);color:#5b6078;margin:3% 0 .3%;letter-spacing:.08em;text-transform:uppercase}
.cert .name{font-family:var(--script);font-style:italic;font-weight:600;font-size:clamp(30px,5.4vw,60px);line-height:1.1;margin:0;color:#000933;
  padding:0 4% .6%;border-bottom:2px solid #ec891d;min-width:58%}
.cert .why{font-size:clamp(10.5px,1.35vw,15px);color:#2c3150;max-width:64ch;margin:2.4% 0 0;line-height:1.5}
.cert .seals{display:flex;gap:1.6%;justify-content:center;margin-top:2.4%;width:100%}
.seal{display:flex;flex-direction:column;align-items:center;gap:4px;width:12%}
.seal b{width:clamp(28px,4vw,44px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#000933;color:#ec891d;
  font-size:clamp(9px,1.2vw,13px);border:2px solid #ec891d;box-shadow:0 0 0 3px #fffdf9,0 0 0 4px rgba(0,9,51,.15)}
.seal.off b{background:#eceef4;color:#b8bbc9;border-color:#d7d9e3}
.seal small{font-size:clamp(7.5px,.95vw,10.5px);color:#2c3150;font-weight:600;line-height:1.15}
.cert .foot{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4%}
.cert .sig{border-top:1px solid #000933;padding-top:6px;font-size:clamp(8.5px,1.05vw,12px);color:#2c3150;line-height:1.35}
.cert .sig b{display:block;color:#000933;font-size:clamp(9.5px,1.15vw,13px)}
.rosette{width:clamp(70px,10vw,110px);aspect-ratio:1;position:relative;display:grid;place-items:center}
.rosette svg{position:absolute;inset:0;width:100%;height:100%}
.rosette .rv{position:relative;color:#fff;text-align:center;line-height:1.05;font-weight:800;font-size:clamp(11px,1.6vw,18px);font-variant-numeric:tabular-nums}
.rosette .rv small{display:block;font-size:.5em;letter-spacing:.12em;font-weight:700;color:#000933}
.cert .tagline{position:absolute;right:4.2%;bottom:1.6%;font-size:clamp(8px,1vw,11px);color:#fff;letter-spacing:.04em}
.cert .tagline span{color:#ec891d}
.cert-note{font-size:13px;color:var(--muted);margin:10px 0 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);opacity:0;
  background:var(--charcoal);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:.3s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--orange)}
.foot-note{font-size:12px;color:var(--muted);margin-top:28px}
.sr{position:absolute;left:-9999px}

@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:18px}
  .route{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  .route h2{display:none}
  .stop{grid-template-columns:1fr;justify-items:center;text-align:center;min-width:80px;gap:4px}
  .stop::after{display:none}
  .stop .s{display:none}
  .stop .t{font-size:12px}
  h1{font-size:24px}
  .stats{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

let S={xp:0,done:{},learned:{},cur:0,name:"",best:{},date:""};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const panel=$("#panel");
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(html){const t=$("#toast");t.innerHTML=html;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1700)}
function addXP(n,msg){S.xp+=n;save();hud();toast((msg||"¡Bien!")+" <b>+"+n+" XP</b>")}
function unlocked(i){return i===0||!!S.done[LEVELS[i-1].id]}
function rank(){let r=RANKS[0][1];RANKS.forEach(([x,n])=>{if(S.xp>=x)r=n});return r}
const GAME=LEVELS.slice(0,-1);
function hud(){
  const d=GAME.filter(l=>S.done[l.id]).length, p=Math.round(d/GAME.length*100);
  $("#xp").textContent=S.xp;$("#lvl").textContent=rank();$("#pct").textContent=p+"%";
  $("#barfill").style.width=p+"%";document.querySelector(".bar").setAttribute("aria-valuenow",p);
  const r=$("#route");r.innerHTML="";
  LEVELS.forEach((l,i)=>{
    const b=document.createElement("button");
    const st=S.done[l.id]?"done":unlocked(i)?"open":"locked";
    b.className="stop "+st+(i===S.cur?" cur":"");
    b.innerHTML='<span class="dot">'+(S.done[l.id]?"✓":(l.kind==="final"?"★":i+1))+'</span><span><span class="t">'+esc(l.t)+'</span><br><span class="s">'+esc(st==="locked"?"Bloqueado":l.s)+'</span></span>';
    b.setAttribute("aria-label",l.t+(st==="locked"?" (bloqueado)":""));
    if(st==="locked")b.setAttribute("aria-disabled","true");
    b.onclick=()=>{if(unlocked(i)){S.cur=i;save();render()}else toast("Completa el nivel anterior para desbloquear")};
    r.appendChild(b);
  });
}
function cardsFor(l){return l.cards||roleCards(l.role)}
function li(item){const [t,k]=item;return "<li>"+esc(t)+(k==="Estratégica"?' <span class="tag e">Estratégica</span>':k==="Operativa"?' <span class="tag o">Operativa</span>':"")+"</li>"}
function readSection(l){
  let h='<div class="cards">';
  cardsFor(l).forEach((c,k)=>{
    const id=l.id+"-"+k,on=!!S.learned[id];
    h+='<article class="card"><h3>'+esc(c.h)+'</h3><p class="d">'+esc(c.d)+'</p><ul>'+c.li.map(li).join("")+'</ul>'+
       '<button class="learn" data-id="'+id+'" aria-pressed="'+on+'">'+(on?"✓ Leído":"Marcar como leído · +10 XP")+'</button></article>';
  });
  return h+'</div>';
}
function bindLearn(){
  panel.querySelectorAll(".learn").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;if(S.learned[id])return;
    S.learned[id]=1;b.setAttribute("aria-pressed","true");b.textContent="✓ Leído";addXP(10,"Tarjeta leída");updateGate();
  });
}
function allRead(l){return cardsFor(l).every((c,k)=>S.learned[l.id+"-"+k])}
function updateGate(){const l=LEVELS[S.cur];const g=$("#startBtn");if(g){g.disabled=!allRead(l);$("#gateHint").hidden=allRead(l)}}
const SUB={mcq:"Elige la respuesta correcta. 20 XP por acierto.",tf:"¿Es responsabilidad del Gerente de Proyecto? Responde Sí o No. 20 XP por acierto.",
  order:"Ordena las 8 etapas del ciclo del proyecto. 15 XP por etapa en su lugar.",who:"Asigna cada tarea al rol correcto. 20 XP por acierto.",
  eo:"Clasifica cada responsabilidad como estratégica u operativa. 20 XP por acierto."};

function render(){
  hud();const l=LEVELS[S.cur];window.scrollTo({top:0,behavior:"smooth"});
  if(l.kind==="final")return renderFinal();
  let h='<p class="eyebrow">Nivel '+(S.cur+1)+' de '+GAME.length+'</p><h1>'+esc(l.t)+'</h1><p class="lead">'+esc(l.intro)+'</p>';
  if(l.role)h+='<div class="mission"><span class="ic">'+esc(R[l.role].sigla.slice(0,2).toUpperCase())+'</span><div><b>Misión del rol</b>'+esc(R[l.role].mision)+'</div></div>'+
    '<p class="legend"><span><span class="tag e">Estratégica</span> aporta al negocio y a las decisiones</span><span><span class="tag o">Operativa</span> asegura la ejecución diaria</span></p>';
  h+=readSection(l);
  if(l.cycle)h+='<div class="cards" style="grid-template-columns:minmax(0,1fr)"><article class="card"><h3>El ciclo que lidera</h3><div class="tw"><table class="cyc"><thead><tr><th>#</th><th>Etapa</th><th>Responsabilidad</th><th>Tarea estratégica</th></tr></thead><tbody>'+
    DATA.ciclo.map((c,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(c[0])+'</b></td><td>'+esc(c[1])+'</td><td>'+esc(c[2])+'</td></tr>').join("")+'</tbody></table></div></article></div>';
  h+='<p class="hint" id="gateHint"'+(allRead(l)?" hidden":"")+'>Marca todas las tarjetas como leídas para activar el reto.</p>';
  h+='<section class="challenge" id="ch"><h2>Reto: insignia '+esc(l.badge)+'</h2><p class="sub">'+esc(SUB[l.kind])+'</p>'+
     '<button class="btn" id="startBtn"'+(allRead(l)?"":" disabled")+'>'+(S.done[l.id]?"Repetir reto":"Iniciar reto")+'</button></section>';
  panel.innerHTML=h;bindLearn();$("#startBtn").onclick=()=>startChallenge(l);
}

function startChallenge(l){
  if(l.kind==="order")return runOrder(l);
  let i=0,score=0;const qs=l.qs,ch=$("#ch");
  function show(){
    const q=qs[i];let opts,row=false;
    if(l.kind==="tf"){opts=[["Sí",true],["No",false]];row=true}
    else if(l.kind==="eo"){opts=[["Estratégica","E"],["Operativa","O"]];row=true}
    else if(l.kind==="who"){opts=[["Gerente","gp"],["Líder","lp"],["Consultor","cd"],["QA","qa"]];row=true}
    else opts=q.o.map((o,k)=>[o,k]);
    ch.innerHTML='<div class="qcount">Pregunta '+(i+1)+' de '+qs.length+' · Aciertos '+score+'</div><p class="q">'+esc(q.q)+'</p>'+
      '<div class="opts'+(row?" row":"")+'">'+opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o[0])+'</button>').join("")+'</div><div id="fbz"></div>';
    ch.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const val=opts[+b.dataset.k][1],ok=val===q.a;
      ch.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(opts[k][1]===q.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      if(ok){score++;addXP(20,"¡Correcto!")}
      $("#fbz").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Correcto. ":"Aún no. ")+'</b>'+esc(q.e)+'</div><div class="actions"><button class="btn" id="nx">'+(i<qs.length-1?"Siguiente":"Ver resultado")+'</button></div>';
      $("#nx").onclick=()=>{i++;i<qs.length?show():finish(l,score,qs.length)};$("#nx").focus();
    });
  }
  show();
}
function runOrder(l){
  const ch=$("#ch"),pool=CYCLE.map((c,i)=>i).sort(()=>Math.random()-.5),placed=[];
  function draw(){
    ch.innerHTML='<div class="qcount">Toca las etapas en orden · '+placed.length+' de '+CYCLE.length+'</div><p class="q">Ordena el ciclo del proyecto que lidera el Líder.</p>'+
      '<div class="order">'+CYCLE.map((_,k)=>'<div class="slot'+(placed[k]!=null?" filled":"")+'"><span class="n">'+(k+1)+'</span>'+(placed[k]!=null?esc(CYCLE[placed[k]]):'<span style="color:var(--muted)">—</span>')+'</div>').join("")+'</div>'+
      '<div class="pool">'+pool.filter(p=>!placed.includes(p)).map(p=>'<button class="chip" data-p="'+p+'">'+esc(CYCLE[p])+'</button>').join("")+'</div>'+
      '<div class="actions"><button class="btn ghost" id="undo"'+(placed.length?"":" disabled")+'>Deshacer</button><button class="btn" id="chk"'+(placed.length===CYCLE.length?"":" disabled")+'>Comprobar</button></div><div id="fbz"></div>';
    ch.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{placed.push(+b.dataset.p);draw()});
    $("#undo").onclick=()=>{placed.pop();draw()};
    $("#chk").onclick=()=>{
      let score=0;const slots=ch.querySelectorAll(".slot");
      placed.forEach((p,k)=>{const ok=p===k;if(ok)score++;slots[k].classList.add(ok?"right":"wrong")});
      ch.querySelectorAll(".btn").forEach(b=>b.disabled=true);
      if(score)addXP(score*15,score===CYCLE.length?"¡Ciclo perfecto!":"Etapas acertadas");
      $("#fbz").innerHTML='<div class="fb '+(score===CYCLE.length?"ok":"no")+'"><b>'+score+' de '+CYCLE.length+' en su lugar.</b> Orden correcto: '+CYCLE.map(esc).join(" → ")+'.</div><div class="actions"><button class="btn" id="nx">Ver resultado</button></div>';
      $("#nx").onclick=()=>finish(l,score,CYCLE.length);
    };
  }
  draw();
}
function finish(l,score,total){
  const pass=score/total>=0.6,first=!S.done[l.id];
  S.best[l.id]=Math.max(S.best[l.id]||0,score);
  if(pass&&first){S.done[l.id]=1;S.xp+=50;}
  if(GAME.every(x=>S.done[x.id])&&!S.date)S.date=new Date().toISOString().slice(0,10);
  save();hud();
  $("#ch").innerHTML='<h2>'+(pass?"Insignia «"+esc(l.badge)+"» desbloqueada":"Casi lo logras")+'</h2>'+
    '<p class="sub">Obtuviste '+score+' de '+total+'. '+(pass?(first?"Bono de nivel: +50 XP.":"Ya tenías esta insignia."):"Necesitas al menos el 60 % para avanzar. Repasa las tarjetas y vuelve a intentarlo.")+'</p>'+
    '<div class="actions">'+(pass?'<button class="btn" id="go">'+(S.cur===GAME.length-1?"Ver mi certificado":"Siguiente nivel")+'</button>':'')+'<button class="btn ghost" id="again">Repetir reto</button></div>';
  if(pass&&first)toast("Insignia <b>"+esc(l.badge)+"</b>");
  const go=$("#go");if(go)go.onclick=()=>{S.cur++;save();render()};
  $("#again").onclick=()=>startChallenge(l);
}

const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fecha(iso){const d=iso?new Date(iso+"T12:00:00"):new Date();return d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear()}
function rosetteSVG(){
  let pts="";const n=24;for(let k=0;k<n*2;k++){const a=Math.PI*k/n,r=k%2?44:50;pts+=(50+r*Math.cos(a)).toFixed(2)+","+(50+r*Math.sin(a)).toFixed(2)+" ";}
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="'+pts+'" fill="#ec891d"/><circle cx="50" cy="50" r="39" fill="#f6a646"/><circle cx="50" cy="50" r="35" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="2 2"/></svg>';
}
function certHTML(){
  const allDone=GAME.every(l=>S.done[l.id]);
  const nm=S.name||"Tu nombre aquí";
  return '<div class="cert-wrap"><div class="cert" id="cert">'+
   '<svg class="deco" viewBox="0 0 1414 1000" preserveAspectRatio="none" aria-hidden="true">'+
     '<path d="M0 0H560C430 40 300 120 170 210C100 258 45 280 0 290Z" fill="#ec891d"/>'+
     '<path d="M0 0H420C320 30 210 95 110 170C60 207 25 222 0 228Z" fill="#f6a646"/>'+
     '<path d="M1414 1000H1200C1270 992 1335 975 1385 955C1398 950 1408 946 1414 944Z" fill="#000933"/>'+
     '<path d="M1414 1000H1300C1340 995 1380 985 1414 974Z" fill="#ec891d"/>'+
     '<circle cx="1300" cy="120" r="140" fill="none" stroke="#ec891d" stroke-opacity=".12" stroke-width="26"/>'+
     ''+
   '</svg><div class="frame"></div>'+
   '<div class="inner">'+
     '<img class="logo" src="'+LOGO+'" alt="Imagine CX">'+
     '<p class="k">Misión Roles ICX</p>'+
     '<p class="title">CERTIFICADO <span>DE LOGRO</span></p>'+
     '<p class="give">Se otorga a</p>'+
     '<p class="name">'+esc(nm)+'</p>'+
     '<p class="why">'+(allDone?"Por completar la Misión Roles ICX y demostrar que conoce los roles y responsabilidades de los equipos de proyecto de Imagine CX: Gerente de Proyecto, Líder de Proyecto, Consultor / Desarrollador y Analista de Calidad.":"Completa los "+GAME.length+" niveles de la misión para obtener este certificado.")+'</p>'+
     '<div class="seals">'+GAME.map(l=>'<div class="seal'+(S.done[l.id]?"":" off")+'"><b>'+(S.done[l.id]?"★":"·")+'</b><small>'+esc(l.badge)+'</small></div>').join("")+'</div>'+
     '<div class="foot">'+
       '<div class="sig"><b>'+fecha(S.date)+'</b>Fecha de emisión · Rango '+esc(rank())+'</div>'+
       '<div class="rosette">'+rosetteSVG()+'<div class="rv">'+S.xp+'<small>XP</small></div></div>'+
       '<div class="sig" style="text-align:right"><b>Gerencia de Proyectos</b>Imagine CX · It is all about people!</div>'+
     '</div>'+
   '</div>'+
  '</div></div>';
}
function renderFinal(){
  const allDone=GAME.every(l=>S.done[l.id]);
  let h='<p class="eyebrow">Meta</p><h1>Tu certificado</h1><p class="lead">'+(allDone?"Recorriste los cuatro roles de proyecto de Imagine CX. Escribe tu nombre tal como quieres que aparezca en el certificado.":"Completa todos los niveles para obtener el certificado. Así se verá cuando termines.")+'</p>';
  h+='<div class="badges">'+GAME.map(l=>'<span class="badge'+(S.done[l.id]?"":" off")+'"><i>'+(S.done[l.id]?"✓":"·")+'</i>'+esc(l.badge)+'</span>').join("")+'</div>';
  h+='<form class="namefield" id="nf"><label for="nm" class="sr">Tu nombre</label><input id="nm" maxlength="60" placeholder="Tu nombre completo" value="'+esc(S.name)+'"><button class="btn" type="submit">Poner mi nombre</button></form>';
  h+=certHTML()+'<p class="cert-note">Para guardarlo, toma una captura de pantalla del certificado y compártelo con tu equipo.</p>';
  h+='<div class="actions"><button class="btn ghost" id="rst">Reiniciar misión</button></div><div id="rstc"></div>';
  h+='<p class="foot-note">Fuente: ICX · Roles y Responsabilidades, versión 1.1.0. Tu progreso se guarda solo en este navegador.</p>';
  panel.innerHTML=h;
  $("#nf").onsubmit=e=>{e.preventDefault();S.name=$("#nm").value.trim().slice(0,60);save();renderFinal();toast("Nombre actualizado")};
  $("#rst").onclick=()=>{$("#rstc").innerHTML='<div class="fb no">¿Borrar tu progreso y XP?<div class="actions"><button class="btn" id="rsy">Sí, reiniciar</button><button class="btn ghost" id="rsn">Cancelar</button></div></div>';
    $("#rsy").onclick=()=>{S={xp:0,done:{},learned:{},cur:0,name:"",best:{},date:""};save();render()};$("#rsn").onclick=()=>$("#rstc").innerHTML=""};
}
if(!unlocked(S.cur))S.cur=0;
render();
})();
</script>

</body>
</html>
